<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="hero texture placeholder">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f0efee"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="t"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <g opacity="0.08" filter="url(#grain)">
    <rect width="100%" height="100%" fill="#000"/>
  </g>
  <!-- simple soft vignette -->
  <ellipse cx="1000" cy="500" rx="900" ry="400" fill="none" stroke="#e8e6e5" stroke-width="220" opacity="0.035" />
</svg>
